AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: url-shortener
###########################################################
Parameters:
  ###########################################################
  pEnv:
    Type: String
  pAWSRegion:
    Type: String
  pProjectName:
    Type: String
  pProductName:
    Type: String
  pMinChar:
    Type: String
  pMaxChar:
    Type: String
  pDescription:
    Type: String
  pAlertsRecipient:
    Type: String
  pCertificateArn:
    Type: String
  pHostedZoneId:
    Type: String
  pDomain:
    Type: String
  pSubDomain:
    Type: String
  pFallbackUrl:
    Type: String
  pGoogleClientId:
    Type: String
    Description: Google OAuth Client ID

###########################################################
Conditions:
  HasSubDomain: !And
    - !Not [!Equals [!Ref pSubDomain, ""]]
    - !Not [!Equals [!Ref pSubDomain, "NONE"]]

###########################################################
Resources:
  ###########################################################
  AuthorizerFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      FunctionName: !Sub ${pProductName}-${pProjectName}-authorizer-${pEnv}
      Description: Google OAuth authorizer for URL shortener
      Handler: authorizer.lambda_handler
      Runtime: python3.10
      CodeUri: ../authorizer/
      MemorySize: 256
      Architectures:
        - arm64
      Timeout: 30
      Environment:
        Variables:
          AUTH_USERS_TABLE: !Sub "${pProductName}-${pProjectName}-auth-users-${pEnv}"
          API_KEYS_TABLE: !Sub "${pProductName}-${pProjectName}-api-keys-${pEnv}"
          GOOGLE_CLIENT_ID: !Ref pGoogleClientId
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AuthUsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ApiKeysTable.Arn
      Tags:
        Project: !Ref pProjectName
        Product: !Ref pProductName
        Environment: !Ref pEnv

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${APIGateway}/*"

  ShortenerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ShortenerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${APIGateway}/*"

  ShortenerFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      FunctionName: !Sub ${pProductName}-${pProjectName}-${pEnv}
      Description: !Ref pDescription
      Handler: handlers.main
      Runtime: python3.10
      CodeUri: ../shortener/
      Events: {}
      MemorySize: 256
      Architectures:
        - arm64
      Timeout: 300
      Environment:
        Variables:
          DOMAIN: !Ref pDomain
          SUB_DOMAIN: !Ref pSubDomain
          API_DOMAIN: !If [HasSubDomain, !Sub "${pSubDomain}.${pDomain}", !Ref pDomain]
          FALLBACK_URL: !Ref pFallbackUrl
          ENVIRONMENT: !Ref pEnv
          TABLE_NAME: !Sub "${pProductName}-${pProjectName}-url-table-${pEnv}"
          CLICKS_STATS_TABLE: !Sub "${pProductName}-${pProjectName}-clicks-stats-${pEnv}"
          REGION: !Ref pAWSRegion
          MIN_CHAR: !Ref pMinChar
          MAX_CHAR: !Ref pMaxChar
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UrlDynamoTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt ClicksStatsTable.Arn
      Tags:
        Project: !Ref pProjectName
        Product: !Ref pProductName
        Environment: !Ref pEnv
        Endpoint: !If [HasSubDomain, !Sub "${pSubDomain}.${pDomain}", !Ref pDomain]

  APIGateway:
    Type: AWS::Serverless::Api
    DependsOn: ShortenerFunction
    Properties:
      Domain:
        DomainName: !If [HasSubDomain, !Sub "${pSubDomain}.${pDomain}", !Ref pDomain]
        CertificateArn: !Ref pCertificateArn
        EndpointConfiguration: EDGE
        Route53:
          HostedZoneId: !Ref pHostedZoneId
      StageName: prod
      DisableExecuteApiEndpoint: true
      DefinitionBody:
        swagger: 2.0
        info:
          version: "1.0"
          title: !Sub ${pProductName}-${pProjectName}-api-${pEnv}
        schemes:
          - "https"
        securityDefinitions:
          GoogleAuth:
            type: "apiKey"
            name: "Authorization"
            in: "header"
            x-amazon-apigateway-authtype: "custom"
            x-amazon-apigateway-authorizer:
              type: "token"
              authorizerUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations"
              authorizerResultTtlInSeconds: 300
        paths:
          /create:
            options:
              consumes:
                - "application/json"
              produces:
                - "application/json"
              responses:
                "200":
                  description: "200 response"
                  schema:
                    $ref: "#/definitions/Empty"
                  headers:
                    Access-Control-Allow-Origin:
                      type: "string"
                    Access-Control-Allow-Methods:
                      type: "string"
                    Access-Control-Allow-Headers:
                      type: "string"
              x-amazon-apigateway-integration:
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Origin: !Sub
                        - "'${WebsiteUrl}'"
                        - WebsiteUrl: !Sub "https://short.${pDomain}"
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                passthroughBehavior: "when_no_match"
                type: "mock"
            post:
              security:
                - GoogleAuth: []
              produces:
                - "application/json"
              responses:
                "200":
                  description: "200 response"
                  schema:
                    $ref: "#/definitions/Empty"
              x-amazon-apigateway-integration:
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ShortenerFunction.Arn}/invocations"
                httpMethod: "POST"
                responses:
                  default:
                    statusCode: "200"
                passthroughBehavior: "when_no_match"
                contentHandling: "CONVERT_TO_TEXT"
                type: "aws_proxy"
          /{shortid}:
            get:
              security: [] # Public endpoint - no authentication required
              consumes:
                - "application/json"
              parameters:
                - name: "shortid"
                  in: "path"
                  required: true
                  type: "string"
              responses:
                "301":
                  description: "301 response"
                  headers:
                    Location:
                      type: "string"
              x-amazon-apigateway-integration:
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ShortenerFunction.Arn}/invocations"
                httpMethod: "POST"
                responses:
                  default:
                    statusCode: "301"
                    responseParameters:
                      method.response.header.Location: "integration.response.body.location"
                requestTemplates:
                  application/json: "{\n    \"short_id\": \"$input.params('shortid')\"\n}"
                passthroughBehavior: "when_no_templates"
                contentHandling: "CONVERT_TO_TEXT"
                type: "aws"
          /stats/{shortid}:
            options:
              consumes:
                - "application/json"
              produces:
                - "application/json"
              responses:
                "200":
                  description: "200 response"
                  schema:
                    $ref: "#/definitions/Empty"
                  headers:
                    Access-Control-Allow-Origin:
                      type: "string"
                    Access-Control-Allow-Methods:
                      type: "string"
                    Access-Control-Allow-Headers:
                      type: "string"
              x-amazon-apigateway-integration:
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Origin: !Sub
                        - "'${WebsiteUrl}'"
                        - WebsiteUrl: !Sub "https://short.${pDomain}"
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                passthroughBehavior: "when_no_match"
                type: "mock"
            get:
              security:
                - GoogleAuth: []
              consumes:
                - "application/json"
              produces:
                - "application/json"
              parameters:
                - name: "shortid"
                  in: "path"
                  required: true
                  type: "string"
              responses:
                "200":
                  description: "200 response"
                  schema:
                    $ref: "#/definitions/Empty"
              x-amazon-apigateway-integration:
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ShortenerFunction.Arn}/invocations"
                httpMethod: "POST"
                responses:
                  default:
                    statusCode: "200"
                passthroughBehavior: "when_no_match"
                contentHandling: "CONVERT_TO_TEXT"
                type: "aws_proxy"
        definitions:
          Empty:
            type: object
            title: Empty Schema
        x-amazon-apigateway-gateway-responses:
          MISSING_AUTHENTICATION_TOKEN:
            statusCode: 404
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |
                {
                  "message": "Resource not found",
                  "error": "404 Not Found"
                }
          RESOURCE_NOT_FOUND:
            statusCode: 404
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |
                {
                  "message": "Resource not found",
                  "error": "404 Not Found"
                }
          UNAUTHORIZED:
            statusCode: 401
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |
                {
                  "message": "Unauthorized - Authentication required",
                  "error": "401 Unauthorized"
                }
          ACCESS_DENIED:
            statusCode: 403
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |
                {
                  "message": "Access denied - You are not authorized to use this service",
                  "error": "403 Forbidden"
                }

  UrlDynamoTable:
    Type: AWS::DynamoDB::Table
    # DeletionPolicy: Retain
    # UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: short_id
          AttributeType: S
      KeySchema:
        - AttributeName: short_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !Sub "${pProductName}-${pProjectName}-url-table-${pEnv}"
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Product
          Value: !Ref pProductName
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AuthUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !Sub "${pProductName}-${pProjectName}-auth-users-${pEnv}"
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Product
          Value: !Ref pProductName

  ApiKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: key_hash
          AttributeType: S
      KeySchema:
        - AttributeName: key_hash
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !Sub "${pProductName}-${pProjectName}-api-keys-${pEnv}"
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Product
          Value: !Ref pProductName

  ClicksStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: short_id
          AttributeType: S
        - AttributeName: week
          AttributeType: S
      KeySchema:
        - AttributeName: short_id
          KeyType: HASH
        - AttributeName: week
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !Sub "${pProductName}-${pProjectName}-clicks-stats-${pEnv}"
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Product
          Value: !Ref pProductName

  ShortenerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${pProductName}-${pProjectName}-${pEnv}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Product
          Value: !Ref pProductName

  ShortenerCloudWatchLogsMetricsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${pProductName}-${pProjectName}-${pEnv}"
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Sub ${pProductName}-${pProjectName}-${pEnv}
          MetricName: "ERROR"
          DefaultValue: 0
    DependsOn: ShortenerLambdaLogGroup

  ShortenerErrorAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertingTopic
      AlarmDescription: !Sub "Alarm for ERROR on ${pProductName}-${pProjectName}-${pEnv} function"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: ERROR
      Namespace: !Sub ${pProductName}-${pProjectName}-${pEnv}
      OKActions:
        - !Ref AlertingTopic
      Period: 10
      Statistic: Sum
      Threshold: 1
      TreatMissingData: ignore

  AlertingTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      DisplayName: !Sub "[${pEnv}] Alarm Topic for ${pProductName}-${pProjectName}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref pAlertsRecipient
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Product
          Value: !Ref pProductName
